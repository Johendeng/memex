[package]
name = "memex"
version = "1.0.6"
edition = "2021"
description = "Memex — local knowledge base indexer (text search, MCP, no LLM)"
license = "Apache-2.0"

[lib]
name = "memex"
path = "src/lib.rs"

[[bin]]
name = "memex"
path = "src/main.rs"

# M1 uses only pure-Rust crates (no C toolchain required).
# SQLite + Tantivy remain the M3 target per docs/tech-design.md.
[dependencies]
anyhow = "1"
bincode = "1"
dirs = "5"
globset = "0.4"
quick-xml = "0.36"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
pdf-extract = "0.7"
walkdir = "2"
sha2 = "0.10"
rust-embed = { version = "8", features = ["debug-embed"] }
notify = "6"

# M3: 语义嵌入 — fastembed 封装 ort(ONNX Runtime) + tokenizers + 模型下载
# ort-load-dynamic: 运行时加载 onnxruntime.dll，绕开 GNU target 无预编译包的限制
# hf-hub-rustls-tls: 纯 Rust TLS（不依赖 OpenSSL）
fastembed = { version = "4", default-features = false, features = ["ort-load-dynamic", "hf-hub-rustls-tls"] }
tray-icon = "0.17"
memmap2 = "0.9"

# PDF parsing: pdfium-render (runtime bind to pdfium.dll, graceful fallback)
pdfium-render = { version = "0.9", optional = true }

# OCR: rusto-rs v0.3+ (pure Rust RTen inference, PaddleOCR PP-OCRv6)
rusto-rs = { version = "0.3", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "tiff", "webp"], optional = true }

[dependencies.clap]
version = "4"
features = ["derive"]

[dependencies.wry]
version = "0.40"

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["blocking", "rustls-tls", "json"]

[dependencies.tao]
version = "0.30"

[dependencies.png]
version = "0.17"

[features]
default = []
pdfium = ["dep:pdfium-render"]
ocr = ["dep:rusto-rs", "dep:image"]

[profile.release]
lto = true
strip = true
